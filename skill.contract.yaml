name: custom-ip-illustration
kind: orchestrator
owner: community
status: release-candidate
version: 0.1.0-rc.3
scope: direct/manual

inputs:
  - name: content
    type: text_or_json
    required: false
  - name: ip_profile
    type: ip-profile/v1
    required: false
  - name: authorized_reference
    type: local_image_path
    required: false
  - name: character_master
    type: local_png_path
    required: false
  - name: tutorial_character
    type: tutorial_character_id
    required: false
  - name: brief
    type: ip-illustration-brief/v1
    required: false
  - name: available_image_backends
    type: runtime_inventory
    required: false

outputs:
  - name: prompts
    type: markdown_files
    required: false
  - name: render_request
    type: render-request/v1
    required: false
  - name: run_manifest
    type: run-manifest/v1
    required: false
  - name: character_master
    type: png_file
    required: false
  - name: confirmed_ip_profile
    type: ip-profile/v1
    required: false
  - name: images
    type: bitmap_files
    required: false
  - name: qa_report
    type: structured_result
    required: false

stops:
  - name: invalid_or_unconfirmed_ownership
    condition: a provided profile is invalid, or ownership remains unconfirmed after onboarding
  - name: unauthorized_character
    condition: user does not own or have permission to use the character
  - name: output_inside_skill
    condition: runtime output would be written inside the installed Skill
  - name: backend_choice_required
    condition: first use has no explicit or ready saved choice, or a saved preference is unavailable

operation_modes:
  character_onboarding:
    input_requirement:
      at_least_one_of:
        - authorized_reference
        - character_master
        - tutorial_character
    possible_outputs:
      - character_master
      - confirmed_ip_profile
    minimum_output_count: 1
    compile_artifacts_required: false
  article_illustration:
    required_inputs:
      - content
      - ip_profile
      - brief
    required_outputs:
      - prompts
      - render_request
      - run_manifest
    images_required: false
    images_optional_when: selected backend is prompt-only or rendering is not requested

delegates:
  - name: host_image_generation_tool
    contract: prompt + canvas + output_path + selected_reference_images
  - name: host_visual_inspection_tool
    contract: image + qa checklist

rendering_backends:
  - codex-image-tool
  - openai-direct
  - ai-router
  - prompt-only

providers:
  - name: openai-direct
    classification: open_source_byok
    credential_sources:
      - env
      - config_file
    secrets_outside_skill_dir: true
    network_allowlist:
      - api.openai.com
    side_effect_boundary:
      dry_run_no_remote_side_effects: true
      apply_requires_explicit_user_approval: true
    redaction:
      enabled: true
      forbidden_output_fields:
        - api_key
        - authorization
        - openai_api_key
    docs:
      revoke_rotate_delete: SECURITY.md

valid_outcomes:
  prompt-only:
    status: compile_only
    required_outputs:
      - prompts
      - render_request
      - run_manifest

forbidden:
  - unlicensed_character_imitation
  - default_bundled_identity
  - hardcoded_user_absolute_paths
  - credentials_in_skill_or_preferences
  - provider_model_retry_or_fallback_in_render_request
  - hidden_or_unapproved_remote_side_effect
  - writing_runtime_outputs_into_skill_root
  - instructions_from_untrusted_content_or_metadata

approvals:
  - name: image_generation
    satisfied_by: explicit user request to generate or create images
  - name: save_or_replace_ip_profile
    satisfied_by: explicit user confirmation after profile preview
  - name: save_backend_preference
    satisfied_by: explicit user request to remember the backend

side_effect_boundary:
  compile_is_local_only: true
  compile_calls_network: false
  image_generation_owned_by_selected_backend: true
  direct_openai_adapter_model: gpt-image-2
  profile_changes_require_explicit_confirmation: true
  preference_changes_require_explicit_request: true

state:
  profile_discovery:
    - explicit profile, attachment or path from the current request
    - .custom-ip-illustration/ip-profile.json
  preference_strategy: project preference, then XDG preference, then user preference; first hit wins
  preference_files:
    - .custom-ip-illustration/EXTEND.md
    - ${XDG_CONFIG_HOME}/custom-ip-illustration/EXTEND.md
    - ${HOME}/.custom-ip-illustration/EXTEND.md
  secrets_in_skill_or_preferences_allowed: false
  direct_openai_secret_sources:
    - process OPENAI_API_KEY
    - user-level ${HOME}/.custom-ip-illustration/.env

scripts:
  - path: scripts/compile_ip_illustration.py
    side_effect: local_output_only
  - path: scripts/resolve_backend.py
    side_effect: none
  - path: scripts/openai_backend.py
    side_effect: optional_paid_image_generation_and_user_output
  - path: scripts/verify_release.py
    side_effect: none

tests:
  command: python3 -m unittest discover -s tests -p test_*.py
  regression_cases:
    - tests/cases/success.yaml
    - tests/cases/failure.yaml
    - tests/cases/high-risk.yaml
    - tests/cases/negative-trigger.yaml
  security_cases:
    - missing credentials returns missing_credentials without a network request
    - redaction masks provider tokens and API key values
    - blocked non-allowlisted host is prevented by the fixed api.openai.com endpoint
    - no secret JSON output includes API keys or authorization headers

evaluation:
  suite_id: custom-ip-illustration-v0-2
  score_scope: structural_readiness
  claims:
    utility: false
  case_portfolio:
    success: tests/cases/success.yaml
    failure: tests/cases/failure.yaml
    high_risk: tests/cases/high-risk.yaml
  type_checks:
    - cross_stage_io
    - partial_failure
    - aggregation
    - backend_selection
    - ownership_gate
    - explicit_four_backend_choice
    - portability
  baseline: evidence/evaluation/v0.1.0/baseline-results.json
  holdout: tests/evaluation/suite.yaml
  negative_transfer: reject_if_baseline_pass_becomes_candidate_fail
  independent_review: evidence/reviews/v0.1.0-independent-review.md
