schema_version: v1alpha1

environment:
  type: none
  env:
    HOME: /tmp/ip-pic-skill-up-clean-home
    CODEX_HOME: /tmp/ip-pic-skill-up-clean-home/.codex

skills:
  - source: local_path
    path: .

engine:
  name: codex

cases:
  files:
    - evals/cases/compile-direct-prompt-only.yaml
    - evals/cases/first-run-selection.yaml
    - evals/cases/unauthorized-character.yaml
    - evals/cases/negative-trigger.yaml
    - evals/cases/partial-failure-recovery.yaml
  defaults:
    timeout_seconds: 420
    max_turns: 8
    collect_artifacts:
      - "ip-pic-eval-output/**"
  parallelism: 1
  retry_policy:
    max_retries: 0

benchmark:
  enabled: true

report:
  formats: [json, html, junit]
  artifacts: [transcript]
