id: authorized-direct-integrated
name: Authorized direct-integrated routing
description: 为已授权角色规划、编译并验收中文文章 IP 配图和静态视频关键帧。用户说“IP 配图”“自定义角色配图”“文章人物插画”“IP 静态关键帧”时使用；支持两种交付模式、四种画布、13 个结构、六种风格、批量连续性与失败重做。先确认用户选择与角色权利，再编译并逐图 QA。不用于知识卡片、封面、海报或发布平台。
tags:
  - success
  - direct-integrated
inputs:
  prompt: "Contract probe: confirmed selection, authorized tutorial character, direct-integrated text, 13 templates, 6 styles, render handoff, and visual QA."
expected:
  output_contains:
    - confirmed selection
    - authorized tutorial character
    - direct-integrated text
    - render handoff
graders:
  - name: success_contract_terms
    type: text
    config:
      contains:
        - visual QA
